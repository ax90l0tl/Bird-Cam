###############################################
# Global settings

# Verbosity: error, warn, info, debug
logLevel: info
logDestinations: [stdout]
logFile: mediamtx.log

# Timeouts and queues
readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 512
udpMaxPayloadSize: 1472

###############################################
# Authentication (internal)

authMethod: internal

authInternalUsers:
  # Unprivileged user (any)
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:
      - action: playback
        path:

  # Local API access
  - user: any
    pass:
    ips: ['127.0.0.1', '::1', '192.168.1.1']
    permissions:
      - action: api
      - action: metrics
      - action: pprof

###############################################
# Control API (enabled)

api: yes
apiAddress: :9997
apiEncryption: no
apiAllowOrigins: ['*']

###############################################
# Playback server (for recordings)

playback: yes
playbackAddress: :9996
playbackEncryption: no
playbackAllowOrigins: ['*']

###############################################
# WebRTC server (streaming on 8889)

webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcAllowOrigins: ['*']
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: yes
webrtcHandshakeTimeout: 10s
webrtcTrackGatherTimeout: 2s

# Other protocols disabled
rtsp: no
rtmp: no
hls: no
srt: no

###############################################
# Default path settings

pathDefaults:
  source: publisher
  sourceOnDemand: no
  maxReaders: 0
  useAbsoluteTimestamp: true

  # Recording (enabled)
  record: no
  recordPath: Bird-Cam/videos/%path/%Y-%m-%d_%H-%M-%S-%f=%z
  recordFormat: fmp4
  recordPartDuration: 1s
  recordMaxPartSize: 50M
  recordSegmentDuration: 1m
  recordDeleteAfter: 7d

  # Raspberry Pi Camera defaults
  rpiCameraCamID: 0
  rpiCameraSecondary: false
  rpiCameraWidth: 960
  rpiCameraHeight: 540
  rpiCameraHFlip: false
  rpiCameraVFlip: false
  rpiCameraBrightness: 0
  rpiCameraContrast: 1
  rpiCameraSaturation: 1
  rpiCameraSharpness: 1
  rpiCameraExposure: normal
  rpiCameraAWB: auto
  rpiCameraDenoise: "off"
  rpiCameraFPS: 30
  rpiCameraAfMode: continuous
  rpiCameraAfRange: normal
  rpiCameraAfSpeed: normal
  rpiCameraTextOverlayEnable: true
  rpiCameraTextOverlay: '%Y-%m-%d %H:%M:%S'
  rpiCameraCodec: auto
  rpiCameraIDRPeriod: 60
  rpiCameraBitrate: 1500000
  rpiCameraH264Profile: main
  rpiCameraH264Level: '4.1'

###############################################
# Paths

paths:
  cam:
    source: rpiCamera
    # record inherits yes from pathDefaults